<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // https://github.com/rafgraph/spa-github-pages
      //
      // Pairs with public/404.html: when GitHub Pages serves that file for
      // an in-app route (e.g. /about), it redirects here with the real
      // path encoded as a query string. This runs first, before React
      // Router mounts, and rewrites the visible URL back via
      // history.replaceState so the app boots on the correct route.
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function (s) {
            return s.replace(/~and~/g, '&')
          }).join('?')
          window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
          )
        }
      }(window.location))
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="canonical" href="https://jetona.ru/" />

    <title>Jetūna — билеты на мероприятия</title>
    <meta
      name="description"
      content="Jetūna — билеты на концерты, фестивали, стендап и другие живые события. Оплата онлайн, электронный билет с QR-кодом сразу после покупки."
    />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Jetūna" />
    <meta property="og:title" content="Jetūna — билеты на мероприятия" />
    <meta
      property="og:description"
      content="Билеты на концерты, фестивали и шоу — быстро и без переплат. Электронный билет приходит сразу после оплаты."
    />
    <meta property="og:url" content="https://jetona.ru/" />
    <meta property="og:image" content="https://jetona.ru/favicon.svg" />
    <meta property="og:locale" content="ru_RU" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Jetūna — билеты на мероприятия" />
    <meta
      name="twitter:description"
      content="Билеты на концерты, фестивали и шоу — быстро и без переплат."
    />
    <meta name="twitter:image" content="https://jetona.ru/favicon.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <!-- QR decoding for the organizer's ticket scanner (Scan.jsx) — no npm
         dependency since the repo has no local install/build step in this
         workflow, so this loads as a plain global instead. -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.js"></script>
    <!-- PDF e-ticket generation (ticketPdf.js) — same reasoning as jsQR above. -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
