<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>Jetūna — билеты на мероприятия</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- QR decoding for the organizer's ticket scanner (Scan.jsx) — no npm
         dependency since the repo has no local install/build step in this
         workflow, so this loads as a plain global instead. -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.js"></script>
    <!-- PDF e-ticket generation (ticketPdf.js) — same reasoning as jsQR above. -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
